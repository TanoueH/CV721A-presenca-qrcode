{% extends "base.html" %}
{% block content %}

<div class="projecao">
  <div class="topbar">
    <div>
      <div class="title">{{ disciplina }}</div>
      <div class="subtitle">{{ turma }}</div>
    </div>
    <div class="stats">
      <div><strong>Presentes:</strong> <span id="presentes">{{ qtd_presentes }}</span></div>
      <div><strong>Expira em:</strong> <span id="expira">--:--:--</span></div>
      <div><strong>Tempo:</strong> <span id="restante">--:--</span></div>
      <div id="msg" class="muted" style="display:none;"></div>
    </div>
  </div>

  <div style="margin-top:10px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
    <button class="btn primary" id="btn-renovar" type="button">Renovar QR</button>
    <a class="btn" href="/prof/{% if prof_k %}?k={{ prof_k }}{% endif %}" target="_blank">Painel</a>
  </div>

  <div class="qrwrap">
    <img id="qr" src="/prof/qr.png{% if prof_k %}?k={{ prof_k }}{% endif %}" alt="QR Code">
  </div>

  <div class="footer">
    <span>Aluno: aponte a câmera e preencha RA + Nome.</span>
  </div>
</div>

<script>
(function () {
  const profK = "{{ prof_k }}".trim();
  const msgEl = document.getElementById("msg");
  let qrVersion = Date.now();
  let lastExpireMs = null;

  function withKey(url){
    if (!profK) return url;
    return url + (url.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(profK);
  }

  function setMsg(text){
    if (!msgEl) return;
    if (!text){
      msgEl.style.display = "none";
      msgEl.textContent = "";
      return;
    }
    msgEl.style.display = "block";
    msgEl.textContent = text;
  }

  function refreshQR(){
    qrVersion = Date.now();
    const img = document.getElementById("qr");
    const base = withKey("/prof/qr.png");
    img.src = base + (base.includes("?") ? "&" : "?") + "v=" + qrVersion;
  }

  function fmt2(n){ return String(n).padStart(2, "0"); }

  async function tick(){
    try{
      const r = await fetch(withKey("/prof/status"));
      if (r.status === 401 || r.status === 403){
        setMsg("Acesso restrito (chave inválida).");
        return;
      }
      if (!r.ok) return;

      const st = await r.json();
      document.getElementById("presentes").textContent = st.qtd_presentes ?? 0;

      let expMs = null;
      if (typeof st.expira_epoch_ms === "number") expMs = st.expira_epoch_ms;
      else if (st.expira_em) expMs = new Date(st.expira_em).getTime();

      if (!expMs){
        setMsg("Aula ainda não iniciada.");
        return;
      }
      setMsg("");

      // Se mudou a expiração (novo QR), atualiza imagem automaticamente
      if (lastExpireMs !== null && expMs !== lastExpireMs){
        refreshQR();
      }
      lastExpireMs = expMs;

      const exp = new Date(expMs);
      const now = Date.now();
      const diffMs = expMs - now;

      document.getElementById("expira").textContent =
        `${fmt2(exp.getHours())}:${fmt2(exp.getMinutes())}:${fmt2(exp.getSeconds())}`;

      const totalSec = Math.max(0, Math.floor(diffMs/1000));
      const min = fmt2(Math.floor(totalSec/60));
      const sec = fmt2(totalSec%60);
      document.getElementById("restante").textContent = `${min}:${sec}`;

      if (totalSec === 0){
        document.getElementById("restante").textContent = "00:00";
      }
    } catch(e) {}
  }

  document.getElementById("btn-renovar").addEventListener("click", async () => {
    const btn = document.getElementById("btn-renovar");
    try{
      btn.disabled = true;
      btn.textContent = "Renovando...";

      const r = await fetch(withKey("/prof/aula/renovar"), { method: "POST" });
      if (!r.ok) throw new Error("Falha ao renovar");
      await r.json();

      refreshQR();
      await tick();

      btn.textContent = "Renovar QR";
      btn.disabled = false;
    } catch(e){
      btn.textContent = "Erro — tente de novo";
      btn.disabled = false;
      setTimeout(() => (btn.textContent = "Renovar QR"), 2000);
    }
  });

  setInterval(tick, 1000);
  tick();
})();
</script>

{% endblock %}
